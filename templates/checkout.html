<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light bg-light px-4">
    <a class="navbar-brand fw-bold" href="/">My Shop</a>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Checkout</h2>

    <h4>Order Summary</h4>
    <ul class="list-group mb-4">
        {% for item in items %}
        <li class="list-group-item d-flex justify-content-between">
            <span>{{ item.product.name }} (x{{ item.quantity }})</span>
            <span>₹{{ item.subtotal }}</span>
        </li>
        {% endfor %}
    </ul>

    <h4 class="mb-4">Total: ₹{{ total }}</h4>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="full_name" class="form-control mb-3" placeholder="Full Name" required>
        <textarea name="address" class="form-control mb-3" placeholder="Address" required></textarea>
        <input type="text" name="city" class="form-control mb-3" placeholder="City" required>
        <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>
        <button type="submit" class="btn btn-success">Place Order</button>
    </form>
</div>

</body>
</html>
